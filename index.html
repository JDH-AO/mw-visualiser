<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>M-W Visualiser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:#000;display:flex;flex-direction:column;position:relative}
.header{background:#000;border-bottom:1px solid #1a1a1a;padding:12px 20px 8px;text-align:center;flex-shrink:0}
.header h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:4px;font-family:sans-serif;font-weight:900}
.car-label{font-size:13px;font-weight:700;color:#3b9eff;letter-spacing:2px;margin-bottom:2px}
.stage{font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-top:2px}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:36px}
.btn{background:linear-gradient(180deg,#3b9eff,#0d4fa8);border:2px solid #5ab0ff;color:#fff;font-weight:700;letter-spacing:3px;font-size:14px;padding:13px 28px;border-radius:8px;cursor:pointer;box-shadow:0 0 18px rgba(59,158,255,.4);text-transform:uppercase;font-family:sans-serif}
.btn:active{transform:translateY(1px)}
.btn-round{border-radius:50px;width:88px;height:88px;padding:0;font-size:12px;letter-spacing:1px}
.splash-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:radial-gradient(ellipse at 50% 40%,#0a1a2e,#000 70%);padding:40px 20px}
.spin{animation:spin 10s linear infinite;filter:drop-shadow(0 0 28px rgba(59,158,255,.5))}
@keyframes spin{to{transform:rotate(360deg)}}
.finder{width:100%;aspect-ratio:4/3;background:#050505;position:relative;display:flex;align-items:center;justify-content:center}
.corner{position:absolute;width:34px;height:34px;border-color:#444;border-style:solid}
.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.finder-text{font-size:14px;letter-spacing:3px;color:#444;text-transform:uppercase}
.size-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.size-controls{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.size-row{display:flex;gap:12px}
.size-box{flex:1;background:#0d0d0d;border:2px solid #222;border-radius:8px;padding:12px 10px;text-align:center}
.size-box.active{border-color:#3b9eff}
.size-lbl{display:block;font-size:9px;letter-spacing:2px;color:#3b9eff;text-transform:uppercase;margin-bottom:4px}
.size-sel{background:transparent;border:none;color:#fff;font-weight:700;font-size:26px;text-align:center;width:100%;cursor:pointer;-webkit-appearance:none}
.size-sel option{background:#111}
.img-wrap{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#0a0a0a;flex-shrink:0}
.car-img{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spin-sm{width:36px;height:36px;border:3px solid #222;border-top-color:#3b9eff;border-radius:50%;animation:spin .8s linear infinite}
.proc-txt{font-size:11px;letter-spacing:3px;color:#3b9eff;font-family:sans-serif}
.wheel-info{padding:12px 20px 8px;text-align:center;border-bottom:1px solid #111;flex-shrink:0}
.w-name{font-weight:700;font-size:16px;letter-spacing:2px;color:#3b9eff}
.w-price{font-size:16px;color:#3b9eff}
.carousel-wrap{padding:10px 0;border-bottom:2px solid #3b9eff;flex-shrink:0}
.carousel-track{display:flex;align-items:center;justify-content:center;gap:6px}
.c-item{border:2px solid transparent;border-radius:6px;padding:5px;cursor:pointer;background:#0a0a0a;transition:all .2s;flex-shrink:0}
.c-item.center{border-color:#3b9eff;box-shadow:0 0 14px rgba(59,158,255,.5);transform:scale(1.05)}
.c-item.side{opacity:.5;transform:scale(.9)}
.c-btn{background:linear-gradient(180deg,#3b9eff,#0d4fa8);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.tap-btn{margin:8px 16px;width:calc(100% - 32px)}
.bottom-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #111;gap:6px;flex-shrink:0}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;color:#3b9eff;font-weight:700;font-size:9px;letter-spacing:1.5px;cursor:pointer;font-family:sans-serif;text-transform:uppercase}
.nav-btn svg{width:19px;height:19px}
.nav-btn.back{color:#666}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#3b9eff;color:#fff;padding:9px 22px;border-radius:50px;font-weight:600;letter-spacing:2px;font-size:12px;z-index:999;animation:fadeup .3s ease;white-space:nowrap;pointer-events:none}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Wheel data ────────────────────────────────────────────────────────────────
const WHEELS = [
  {id:1,name:"M-WI Gloss Black",     size:'20"',price:"£1,950",shopUrl:"https://your-shopify-store.com/products/mwi-gloss-black",     color:"#111",   accentColor:"#444",   spokes:5, style:"split"},
  {id:2,name:"M-WX Frozen Silver",   size:'20"',price:"£2,300",shopUrl:"https://your-shopify-store.com/products/mwx-frozen-silver",   color:"#C0C0C0",accentColor:"#888",   spokes:10,style:"mesh"},
  {id:3,name:"M-WR Gunmetal",        size:'19"',price:"£2,100",shopUrl:"https://your-shopify-store.com/products/mwr-gunmetal",        color:"#4A4A4A",accentColor:"#777",   spokes:7, style:"blade"},
  {id:4,name:"M-WS Gloss White",     size:'21"',price:"£2,550",shopUrl:"https://your-shopify-store.com/products/mws-gloss-white",     color:"#E8E8E8",accentColor:"#BBB",   spokes:5, style:"classic"},
  {id:5,name:"M-WD Bronze",          size:'20"',price:"£2,800",shopUrl:"https://your-shopify-store.com/products/mwd-bronze",          color:"#8B6914",accentColor:"#C49A28",spokes:9, style:"deep"},
  {id:6,name:"M-WF Satin Anthracite",size:'19"',price:"£1,850",shopUrl:"https://your-shopify-store.com/products/mwf-satin-anthracite",color:"#2C2C2C",accentColor:"#555",   spokes:6, style:"twin"},
];
const WHEEL_SIZES=['17"','18"','19"','20"','21"','22"','23"'];
const CAL={cy:0.660,r:0.094,cxF:0.740,cxR:0.250};

// ── State ─────────────────────────────────────────────────────────────────────
let state={
screen:‘splash’,
uploadedImage:null,
composited:null,
carInfo:null,
currentSize:‘19”’,
selectedSize:‘20”’,
carouselIdx:0,
selectedWheel:null,
working:false,
wheelPositions:null,
};

function setState(patch){
Object.assign(state,patch);
render();
}

// ── Draw wheel on canvas ──────────────────────────────────────────────────────
function shade(hex,amt){
const n=parseInt(hex.replace(’#’,’’),16);
const r=Math.min(255,Math.max(0,(n>>16)+amt));
const g=Math.min(255,Math.max(0,((n>>8)&0xff)+amt));
const b=Math.min(255,Math.max(0,(n&0xff)+amt));
return `rgb(${r},${g},${b})`;
}

function drawWheel(ctx,wheel,cx,cy,radius){
const c=wheel.color,ac=wheel.accentColor;
const tyreW=radius*0.20,innerR=radius-tyreW,hubR=radius*0.13,count=wheel.spokes;
// Ground shadow
ctx.save();
ctx.beginPath();ctx.ellipse(cx,cy+radius*0.88,radius*0.82,radius*0.12,0,0,Math.PI*2);
ctx.fillStyle=‘rgba(0,0,0,0.4)’;ctx.filter=‘blur(5px)’;ctx.fill();ctx.filter=‘none’;ctx.restore();
// Tyre
const tg=ctx.createRadialGradient(cx-radius*.15,cy-radius*.15,radius*.3,cx,cy,radius);
tg.addColorStop(0,’#2a2a2a’);tg.addColorStop(.7,’#111’);tg.addColorStop(1,’#050505’);
ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.fillStyle=tg;ctx.fill();
// Rim lip
const lg=ctx.createLinearGradient(cx-innerR,cy,cx+innerR,cy);
lg.addColorStop(0,‘rgba(255,255,255,0.12)’);lg.addColorStop(.35,‘rgba(255,255,255,0.28)’);
lg.addColorStop(.65,‘rgba(255,255,255,0.10)’);lg.addColorStop(1,‘rgba(0,0,0,0.15)’);
ctx.beginPath();ctx.arc(cx,cy,innerR+radius*.04,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,innerR+radius*.04,0,Math.PI*2);ctx.fillStyle=lg;ctx.fill();
// Face
const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,innerR);
fg.addColorStop(0,’#1e1e1e’);fg.addColorStop(.6,’#0f0f0f’);fg.addColorStop(1,’#050505’);
ctx.beginPath();ctx.arc(cx,cy,innerR,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();
// Brake disc
ctx.beginPath();ctx.arc(cx,cy,innerR*.55,0,Math.PI*2);ctx.fillStyle=’#1a1a1a’;ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,innerR*.55,0,Math.PI*2);ctx.strokeStyle=’#333’;ctx.lineWidth=1.5;ctx.stroke();
// Spokes shadow
ctx.lineCap=‘round’;
for(let i=0;i<count;i++){
const angle=(i/count)*Math.PI*2-Math.PI/2;
const drawS=(a,w)=>{
const x1=cx+hubR*1.15*Math.cos(a),y1=cy+hubR*1.15*Math.sin(a);
const x2=cx+innerR*.88*Math.cos(a),y2=cy+innerR*.88*Math.sin(a);
ctx.beginPath();ctx.moveTo(x1+1.5,y1+1.5);ctx.lineTo(x2+1.5,y2+1.5);
ctx.strokeStyle=‘rgba(0,0,0,0.5)’;ctx.lineWidth=w;ctx.stroke();
};
if(wheel.style===‘split’){drawS(angle-.16,radius*.075);drawS(angle+.16,radius*.075);}
else drawS(angle,radius*.075);
}
// Spokes colour
for(let i=0;i<count;i++){
const angle=(i/count)*Math.PI*2-Math.PI/2;
const drawSpoke=(a,w)=>{
const x1=cx+hubR*1.15*Math.cos(a),y1=cy+hubR*1.15*Math.sin(a);
const x2=cx+innerR*.88*Math.cos(a),y2=cy+innerR*.88*Math.sin(a);
const sg=ctx.createLinearGradient(x1,y1,x2,y2);
sg.addColorStop(0,ac);sg.addColorStop(.5,c);sg.addColorStop(1,shade(c,-30));
ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=sg;ctx.lineWidth=w;ctx.stroke();
ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=‘rgba(255,255,255,0.18)’;ctx.lineWidth=w*.22;ctx.stroke();
};
if(wheel.style===‘split’){drawSpoke(angle-.16,radius*.072);drawSpoke(angle+.16,radius*.072);}
else if(wheel.style===‘blade’)drawSpoke(angle,radius*.10);
else drawSpoke(angle,radius*.072);
}
// Rim ring
ctx.beginPath();ctx.arc(cx,cy,innerR+radius*.02,0,Math.PI*2);ctx.strokeStyle=lg;ctx.lineWidth=radius*.04;ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,innerR,0,Math.PI*2);ctx.strokeStyle=‘rgba(0,0,0,0.6)’;ctx.lineWidth=2;ctx.stroke();
// Hub
const hg=ctx.createRadialGradient(cx-hubR*.35,cy-hubR*.35,0,cx,cy,hubR);
hg.addColorStop(0,shade(ac,40));hg.addColorStop(.5,ac);hg.addColorStop(1,shade(c,-40));
ctx.beginPath();ctx.arc(cx,cy,hubR,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,hubR*.5,0,Math.PI*2);
const hcg=ctx.createRadialGradient(cx-hubR*.2,cy-hubR*.2,0,cx,cy,hubR*.5);
hcg.addColorStop(0,’#3a3a3a’);hcg.addColorStop(1,’#0a0a0a’);
ctx.fillStyle=hcg;ctx.fill();
// Shine
const sh=ctx.createRadialGradient(cx-innerR*.35,cy-innerR*.35,0,cx,cy,innerR);
sh.addColorStop(0,‘rgba(255,255,255,0.13)’);sh.addColorStop(.4,‘rgba(255,255,255,0.04)’);sh.addColorStop(1,‘rgba(0,0,0,0)’);
ctx.beginPath();ctx.arc(cx,cy,innerR,0,Math.PI*2);ctx.fillStyle=sh;ctx.fill();
}

// ── SVG wheel ─────────────────────────────────────────────────────────────────
function wheelSVG(wheel,size){
const r=size/2,tyreW=r*.22,innerR=r-tyreW,hubR=r*.12,c=wheel.color,ac=wheel.accentColor;
let spokes=’’;
for(let i=0;i<wheel.spokes;i++){
const angle=(i/wheel.spokes)*Math.PI*2-Math.PI/2;
if(wheel.style===‘split’){
[-0.18,0.18].forEach(d=>{
const a2=angle+d;
const x1=r+hubR*1.2*Math.cos(angle),y1=r+hubR*1.2*Math.sin(angle);
const x2=r+innerR*.88*Math.cos(a2),y2=r+innerR*.88*Math.sin(a2);
spokes+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${r*.07}" stroke-linecap="round"/>`;
spokes+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ac}" stroke-width="${r*.018}" stroke-linecap="round"/>`;
});
} else {
const x1=r+hubR*1.2*Math.cos(angle),y1=r+hubR*1.2*Math.sin(angle);
const x2=r+innerR*.9*Math.cos(angle),y2=r+innerR*.9*Math.sin(angle);
spokes+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${r*.065}" stroke-linecap="round"/>`;
}
}
return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"> <defs> <radialGradient id="rg${wheel.id}${size}" cx="35%" cy="30%"> <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/> <stop offset="100%" stop-color="#000" stop-opacity="0"/> </radialGradient> </defs> <circle cx="${r}" cy="${r}" r="${r-1}" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/> <circle cx="${r}" cy="${r}" r="${innerR}" fill="#0a0a0a"/> <circle cx="${r}" cy="${r}" r="${innerR*.54}" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/> ${spokes} <circle cx="${r}" cy="${r}" r="${innerR}" fill="none" stroke="${c}" stroke-width="${r*.055}"/> <circle cx="${r}" cy="${r}" r="${innerR}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="${r*.015}"/> <circle cx="${r}" cy="${r}" r="${hubR}" fill="${ac}"/> <circle cx="${r}" cy="${r}" r="${hubR*.45}" fill="#0a0a0a"/> <circle cx="${r}" cy="${r}" r="${innerR}" fill="url(#rg${wheel.id}${size})" opacity="0.5"/> </svg>`;
}

// ── Apply wheel to image ──────────────────────────────────────────────────────
function applyWheel(wheel){
if(!state.uploadedImage)return;
setState({selectedWheel:wheel,working:true});
requestAnimationFrame(()=>{
const img=new Image();
img.onload=()=>{
const iw=img.width,ih=img.height;
const canvas=document.createElement(‘canvas’);
canvas.width=iw;canvas.height=ih;
const ctx=canvas.getContext(‘2d’);
ctx.drawImage(img,0,0);
const cur=parseFloat(state.currentSize),sel=parseFloat(state.selectedSize);
const ratio=sel/(cur||sel);
let positions;
if(state.wheelPositions&&state.wheelPositions.length>0){
positions=state.wheelPositions.map(wp=>({cx:wp.cx*iw,cy:wp.cy*ih,r:wp.r*iw*ratio}));
} else {
const r=ih*CAL.r*ratio;
positions=[{cx:iw*CAL.cxR,cy:ih*CAL.cy,r},{cx:iw*CAL.cxF,cy:ih*CAL.cy,r}];
}
positions.forEach(({cx,cy,r})=>{
const feather=ctx.createRadialGradient(cx,cy,r*.7,cx,cy,r*1.1);
feather.addColorStop(0,‘rgba(4,4,4,0.98)’);
feather.addColorStop(.8,‘rgba(4,4,4,0.95)’);
feather.addColorStop(1,‘rgba(4,4,4,0)’);
ctx.beginPath();ctx.arc(cx,cy,r*1.1,0,Math.PI*2);ctx.fillStyle=feather;ctx.fill();
drawWheel(ctx,wheel,cx,cy,r);
});
setState({composited:canvas.toDataURL(‘image/jpeg’,0.92),working:false});
};
img.onerror=()=>setState({working:false});
img.src=state.uploadedImage;
});
}

// ── Resize image ──────────────────────────────────────────────────────────────
function resizeAndLoad(file){
const reader=new FileReader();
reader.onload=e=>{
const img=new Image();
img.onload=()=>{
const MAX=1000;let w=img.naturalWidth,h=img.naturalHeight;
if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
const c=document.createElement(‘canvas’);c.width=w;c.height=h;
c.getContext(‘2d’).drawImage(img,0,0,w,h);
const dataUrl=c.toDataURL(‘image/jpeg’,0.88);
setState({uploadedImage:dataUrl,composited:null,selectedWheel:null,wheelPositions:null,working:false,screen:‘size’});
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}

// ── Save / Share ──────────────────────────────────────────────────────────────
function dataURLtoBlob(dataURL){
const[header,data]=dataURL.split(’,’);
const mime=header.match(/:(.*?);/)[1];
const binary=atob(data);
const arr=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++)arr[i]=binary.charCodeAt(i);
return new Blob([arr],{type:mime});
}

async function handleSave(){
const src=state.composited||state.uploadedImage;
if(!src){showToast(‘No image to save’);return;}
try{
const blob=dataURLtoBlob(src);
const file=new File([blob],`MW-${state.selectedWheel?.name||'car'}.jpg`,{type:‘image/jpeg’});
if(navigator.canShare&&navigator.canShare({files:[file]})){
await navigator.share({title:‘M-W Visualiser’,files:[file]});
return;
}
}catch(e){if(e.name===‘AbortError’)return;}
// Desktop fallback
try{
const blob=dataURLtoBlob(src);
const url=URL.createObjectURL(blob);
const a=document.createElement(‘a’);a.href=url;
a.download=`MW-${state.selectedWheel?.name||'car'}.jpg`;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
showToast(‘Image saved!’);
}catch(e){showToast(‘Save failed — try screenshot’);}
}

async function handleShare(){
const src=state.composited||state.uploadedImage;
if(!src){showToast(‘No image to share’);return;}
try{
const blob=dataURLtoBlob(src);
const file=new File([blob],‘mw-visualiser.jpg’,{type:‘image/jpeg’});
if(navigator.canShare&&navigator.canShare({files:[file]})){
await navigator.share({title:‘M-W Visualiser’,text:`Check out my car with ${state.selectedWheel?.name||'new wheels'}!`,files:[file]});
return;
}
if(navigator.share){
await navigator.share({title:‘M-W Visualiser’,url:window.location.href});
return;
}
}catch(e){if(e.name===‘AbortError’)return;}
showToast(‘Use Save Image instead’);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer=null;
function showToast(msg){
let t=document.getElementById(‘toast’);
if(!t){t=document.createElement(‘div’);t.id=‘toast’;t.className=‘toast’;document.body.appendChild(t);}
t.textContent=msg;t.style.display=‘block’;
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>{t.style.display=‘none’;},3000);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
const app=document.getElementById(‘app’);
const s=state;
const W=WHEELS[s.carouselIdx];
const prev=WHEELS[(s.carouselIdx-1+WHEELS.length)%WHEELS.length];
const next=WHEELS[(s.carouselIdx+1)%WHEELS.length];
const displayImg=s.composited||s.uploadedImage;
const carLabel=s.carInfo?.make?[s.carInfo.make,s.carInfo.model].filter(Boolean).join(’ ‘):’’;

const backBtn=`<button class="nav-btn back" onclick="go('size')"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>BACK</button>`;

let html=’’;

if(s.screen===‘splash’){
html=` <div class="header"><h1>M-W VISUALISER</h1></div> <div class="splash-wrap"> <div class="spin">${wheelSVG(WHEELS[0],210)}</div> <button class="btn" onclick="go('upload')">OPEN</button> </div>`;
}

else if(s.screen===‘upload’){
html=` <div class="header"><h1>M-W VISUALISER</h1><div class="stage">1. Upload Image</div></div> <div class="screen"> <div class="finder"> <div class="corner tl"></div><div class="corner tr"></div> <div class="corner bl"></div><div class="corner br"></div> <span class="finder-text">Upload Car Image</span> </div> <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFile(this)"/> <button class="btn btn-round" onclick="document.getElementById('fileInput').click()">UPLOAD</button> </div>`;
}

else if(s.screen===‘size’){
html=` <div class="header"> ${carLabel?`<div class="car-label">${carLabel}</div>`:''} <h1>M-W VISUALISER</h1> <div class="stage">3. Select Wheel Size</div> </div> <div style="display:flex;flex-direction:column;flex:1"> ${displayImg?`<img class="size-img" src="${displayImg}" alt="Car"/>`:''} <div class="size-controls"> <div class="size-row"> <div class="size-box"> <span class="size-lbl">Current Wheel Size</span> <select class="size-sel" onchange="setState({currentSize:this.value})"> ${WHEEL_SIZES.map(sz=>`<option${sz===s.currentSize?’ selected’:’’}>${sz}</option>`).join('')} </select> </div> <div class="size-box active"> <span class="size-lbl">Selected Wheel Size</span> <select class="size-sel" onchange="setState({selectedSize:this.value})"> ${WHEEL_SIZES.map(sz=>`<option${sz===s.selectedSize?’ selected’:’’}>${sz}</option>`).join('')} </select> </div> </div> </div> </div> <div class="bottom-nav"> <button class="nav-btn back" onclick="go('upload')"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>BACK</button> <button class="btn" onclick="go('select')">NEXT ›</button> </div>`;
}

else if(s.screen===‘select’){
html=` <div class="header"> ${carLabel?`<div class="car-label">${carLabel}</div>`:''} <h1>M-W VISUALISER</h1> <div class="stage">4. Select Wheels</div> </div> <div class="img-wrap"> ${displayImg?`<img class="car-img" src="${displayImg}" alt="Car"/>`:''} ${s.working?`<div class="overlay"><div class="spin-sm"></div><div class="proc-txt">APPLYING WHEELS…</div></div>`:''} </div> <div class="wheel-info"> <span class="w-name">${W.name} ${s.selectedSize} </span> <span class="w-price">${W.price}</span> </div> <div class="carousel-wrap"> <div class="carousel-track"> <button class="c-btn" onclick="prevWheel()">‹</button> <div class="c-item side" onclick="prevWheel()">${wheelSVG(prev,68)}</div> <div class="c-item center">${wheelSVG(W,96)}</div> <div class="c-item side" onclick="nextWheel()">${wheelSVG(next,68)}</div> <button class="c-btn" onclick="nextWheel()">›</button> </div> </div> <button class="btn tap-btn" onclick="applyWheel(WHEELS[state.carouselIdx])" ${s.working?'disabled':''}> ${s.selectedWheel?.id===W.id?'✓ SELECTED':'TAP TO SELECT'} </button> <div class="bottom-nav"> ${backBtn} <button class="nav-btn" onclick="handleSave()" ${!displayImg?'disabled':''}> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> SAVE<br/>IMAGE</button> <button class="nav-btn" onclick="handleShare()" ${!displayImg?'disabled':''}> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg> SHARE<br/>IMAGE</button> <button class="nav-btn" onclick="openShop()"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg> SHOP</button> </div>`;
}

app.innerHTML=html;
}

// ── Global helpers ────────────────────────────────────────────────────────────
function go(screen){setState({screen});}
function onFile(input){if(input.files[0]){setState({working:true});resizeAndLoad(input.files[0]);}}
function prevWheel(){setState({carouselIdx:(state.carouselIdx-1+WHEELS.length)%WHEELS.length,selectedWheel:null,composited:null});}
function nextWheel(){setState({carouselIdx:(state.carouselIdx+1)%WHEELS.length,selectedWheel:null,composited:null});}
function openShop(){
const url=state.selectedWheel?.shopUrl||WHEELS[state.carouselIdx].shopUrl;
window.open(url,’_blank’);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
render();
</script>

</body>
</html>
